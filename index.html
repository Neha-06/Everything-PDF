<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Tools | Every PDF tool in one place</title>
    <meta
      name="description"
      content="Merge, split, compress, convert, edit and protect PDF files. Every tool runs in your browser, so your documents never leave your device."
    />
    <meta name="author" content="Neha Ratna Mishra" />
    <meta name="application-name" content="PDF Tools" />
    <meta name="theme-color" content="#ecf3fa" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/css/theme.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      (function () {
        try {
          if (localStorage.getItem('pdf-tools-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="shell">
      <noscript>
        <div style="padding: 40px; text-align: center">
          This PDF suite needs JavaScript to run - the tools work entirely in your browser.
        </div>
      </noscript>
    </div>
    <script>
      // ES modules are blocked on file:// URLs, so point people at the server
      // instead of leaving them with a blank page.
      if (location.protocol === 'file:') {
        document.addEventListener('DOMContentLoaded', function () {
          var box = document.querySelector('.shell');
          if (!box) return;
          box.innerHTML =
            '<div style="max-width:640px;margin:14vh auto;padding:32px;font:16px/1.6 system-ui,sans-serif;text-align:center">' +
            '<h1 style="font-size:22px;margin:0 0 12px">Start the local server first</h1>' +
            '<p style="margin:0 0 12px">Browsers block JavaScript modules on <code>file://</code> addresses, so the tools cannot run from a double-clicked file.</p>' +
            '<p style="margin:0 0 12px">In the project folder run:</p>' +
            '<p style="margin:0 0 12px"><code>powershell -ExecutionPolicy Bypass -File .\\serve.ps1</code></p>' +
            '<p style="margin:0">Then open the address it prints.</p>' +
            '</div>';
        });
      }
    </script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
